apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-sso-identityserver
spec:
  replicas: 2
  selector:
    matchLabels: { app: enterprise-sso-identityserver }
  template:
    metadata:
      labels: { app: enterprise-sso-identityserver }
    spec:
      serviceAccountName: enterprise-sso
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: identityserver
          image: enterprise-sso/identityserver:latest
          ports: [{ containerPort: 8080 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /health/startup, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-sso-identityserver
spec:
  selector: { app: enterprise-sso-identityserver }
  ports: [{ port: 80, targetPort: 8080 }]
