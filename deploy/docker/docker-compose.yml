services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SSO_SQLSERVER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks: [sso]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SSO_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SSO_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [sso]
  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
    ports: ["5341:80"]
    networks: [sso]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["8025:8025"]
    networks: [sso]
networks:
  sso:
    driver: bridge
volumes:
  sqlserver-data:
